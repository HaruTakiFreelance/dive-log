<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海水魚ガイドブック — Dive Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:     #f4ede0;
      --paper-d:   #e8dbc8;
      --ink:       #333333;
      --ink-fade:  #666655;
      --ink-faint: #999988;
      --accent:    #3d6b8a;
      --accent-d:  #2a4f6b;
      --shadow:    rgba(51,51,51,0.18);

      --bar-h: 56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: linear-gradient(180deg, #03111f 0%, #051828 50%, #071e32 100%);
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--ink);
    }

    /* ── トップバー ─────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--bar-h);
      background: var(--paper);
      border-bottom: 2px solid var(--paper-d);
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
      z-index: 100;
    }

    .back-link {
      font-family: 'Special Elite', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--ink-fade);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }

    .bar-title {
      font-family: 'Special Elite', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .divider {
      width: 1px;
      height: 28px;
      background: var(--paper-d);
      flex-shrink: 0;
    }

    /* ── 目次ボタン ─────────────────────────────────── */
    .toc-btn {
      font-family: 'Special Elite', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: var(--accent-d);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 2px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .toc-btn:hover {
      background: var(--accent);
      color: var(--paper);
    }

    /* ── 検索エリア ─────────────────────────────────── */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 380px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-faint);
      font-size: 0.9rem;
      pointer-events: none;
      font-family: sans-serif;
    }

    #search-input {
      width: 100%;
      padding: 7px 12px 7px 30px;
      font-family: 'Playfair Display', serif;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--paper-d);
      border: 1px solid #cfc3ae;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search-input::placeholder { color: var(--ink-faint); font-style: italic; }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61,107,138,0.18);
    }

    .dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--paper);
      border: 1px solid var(--paper-d);
      border-radius: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      max-height: 260px;
      overflow-y: auto;
      z-index: 200;
    }
    .dropdown.open { display: block; }

    .dropdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .dropdown-item:hover,
    .dropdown-item.active { background: rgba(61,107,138,0.12); }

    .item-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      color: var(--ink);
    }
    .item-page {
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      color: var(--ink-faint);
      letter-spacing: 0.05em;
    }

    /* ── PDF ビューア ───────────────────────────────── */
    #pdf-frame {
      position: fixed;
      top: var(--bar-h);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100vh - var(--bar-h));
      border: none;
    }

    /* ── ジャンプ通知 ───────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent-d);
      color: var(--paper);
      font-family: 'Special Elite', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 8px 20px;
      border-radius: 2px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── 全画面モード ─────────────────────────────── */
    .fullscreen-btn {
      font-family: 'Special Elite', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--ink-fade);
      background: transparent;
      border: 1px solid var(--paper-d);
      border-radius: 2px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .fullscreen-btn:hover {
      background: var(--accent);
      color: var(--paper);
      border-color: var(--accent);
    }

    .topbar { transition: transform 0.22s ease; }
    body.fullscreen .topbar { transform: translateY(-100%); }
    body.fullscreen #pdf-frame { top: 0; height: 100vh; }

    .exit-fs {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(42,79,107,0.92);
      color: var(--paper);
      border: none;
      border-radius: 999px;
      font-family: 'Special Elite', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      padding: 9px 28px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: opacity 0.15s, background 0.15s;
      pointer-events: none;
      opacity: 0;
    }
    .exit-fs:hover { background: var(--accent-d); }
    body.fullscreen .exit-fs {
      display: block;
      opacity: 0.9;
      pointer-events: auto;
      animation: fsSlideUp 0.25s ease;
    }
    @keyframes fsSlideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 0.9; transform: translateX(-50%) translateY(0); }
    }

    /* ── 履歴ラベル ───────────────────────────────── */
    .dropdown-section-label {
      font-family: 'Special Elite', monospace;
      font-size: 0.63rem;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
      padding: 6px 14px 3px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--paper-d);
    }
  </style>
</head>
<body>

  <!-- トップバー -->
  <header class="topbar">
    <a href="index.html" class="back-link">← Home</a>
    <div class="divider"></div>
    <span class="bar-title">Marine Fish / 海水魚図鑑</span>
    <div class="divider"></div>
    <button id="toc-btn" class="toc-btn" title="目次ページへ戻る">目次</button>
    <div class="divider"></div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input
        id="search-input"
        type="text"
        placeholder="科を検索… (例: ハタ科)"
        autocomplete="off"
        spellcheck="false"
      >
      <div id="dropdown" class="dropdown" role="listbox"></div>
    </div>
    <div class="divider"></div>
    <button id="fullscreen-btn" class="fullscreen-btn" title="全画面切り替え">⛶ 全画面</button>
  </header>

  <button id="exit-fs" class="exit-fs" title="全画面解除">✕ 全画面を解除</button>

  <!-- PDF.js ビューア -->
  <iframe
    id="pdf-frame"
    src=""
    title="海水魚ガイドブック"
  ></iframe>

  <!-- ジャンプ通知 -->
  <div id="toast" class="toast"></div>

  <script>
    // ── PDF URL（ローカル or 外部CDN）──────────────────
    // ローカル確認: "../../guidebook.pdf"
    // 本番 (R2等): "https://pub-xxxxx.r2.dev/guidebook.pdf" に差し替える
    const PDF_URL = "https://pub-cae7b56ecb8b408f9f38f4f6f77b4ac8.r2.dev/guidebook.pdf";
    const VIEWER  = "pdfjs/web/viewer.html";
    document.getElementById('pdf-frame').src = `${VIEWER}?file=${encodeURIComponent(PDF_URL)}`;

    // ── 目次データ (guidebook_toc.json から生成) ──────
    const TOC = [{"name":"ネコザメ科","book_page":16,"page":22},{"name":"オオセ科","book_page":16,"page":22},{"name":"テンジクザメ科","book_page":16,"page":22},{"name":"ジンベエザメ科","book_page":17,"page":23},{"name":"オオワニザメ科","book_page":17,"page":23},{"name":"トラザメ科","book_page":18,"page":24},{"name":"ドチザメ科","book_page":18,"page":24},{"name":"メジロザメ科","book_page":19,"page":25},{"name":"シュモクザメ科","book_page":20,"page":26},{"name":"ツノザメ科","book_page":21,"page":27},{"name":"カスザメ科","book_page":21,"page":27},{"name":"ノコギリザメ科","book_page":21,"page":27},{"name":"サカタザメ科","book_page":22,"page":28},{"name":"ウチワザメ科","book_page":22,"page":28},{"name":"シビレエイ科","book_page":22,"page":28},{"name":"ヒラタエイ科","book_page":23,"page":29},{"name":"アカエイ科","book_page":23,"page":29},{"name":"トビエイ科","book_page":24,"page":30},{"name":"ウツボ科","book_page":25,"page":31},{"name":"ウミヘビ科","book_page":32,"page":38},{"name":"アナゴ科","book_page":34,"page":40},{"name":"ニシン科","book_page":36,"page":42},{"name":"コンズイ科","book_page":37,"page":43},{"name":"エソ科","book_page":37,"page":43},{"name":"ホタテエソ科","book_page":38,"page":44},{"name":"クサアジ科","book_page":39,"page":45},{"name":"チゴタラ科","book_page":39,"page":45},{"name":"アシロ科","book_page":40,"page":46},{"name":"アンコウ科","book_page":40,"page":46},{"name":"カエルアンコウ科","book_page":41,"page":47},{"name":"アカグツ科","book_page":45,"page":51},{"name":"キンメダイ科","book_page":46,"page":52},{"name":"イットウダイ科","book_page":46,"page":52},{"name":"マツカサウオ科","book_page":50,"page":56},{"name":"ヒカリキンメダイ科","book_page":51,"page":57},{"name":"マトウダイ科","book_page":51,"page":57},{"name":"ウミテング科","book_page":52,"page":58},{"name":"ヘラヤガラ科","book_page":52,"page":58},{"name":"ヤガラ科","book_page":53,"page":59},{"name":"ヘコアユ科","book_page":53,"page":59},{"name":"カミソリウオ科","book_page":54,"page":60},{"name":"ヨウジウオ科","book_page":55,"page":61},{"name":"ボラ科","book_page":61,"page":67},{"name":"ダツ科","book_page":61,"page":67},{"name":"メバル科","book_page":61,"page":67},{"name":"フサカサゴ科","book_page":64,"page":70},{"name":"ハチ科","book_page":72,"page":78},{"name":"ハオコゼ科","book_page":73,"page":79},{"name":"オニオコゼ科","book_page":73,"page":79},{"name":"イボオコゼ科","book_page":74,"page":80},{"name":"ヒレナガカサゴ科","book_page":75,"page":81},{"name":"ホウボウ科","book_page":75,"page":81},{"name":"コチ科","book_page":75,"page":81},{"name":"セミホウボウ科","book_page":76,"page":82},{"name":"ホタルジャコ科","book_page":76,"page":82},{"name":"ハタ科","book_page":77,"page":83},{"name":"シキシマハナダイ科","book_page":95,"page":101},{"name":"カワリハナダイ科","book_page":96,"page":102},{"name":"メギス科","book_page":96,"page":102},{"name":"タナバタウオ科","book_page":97,"page":103},{"name":"アゴアマダイ科","book_page":98,"page":104},{"name":"キントキダイ科","book_page":99,"page":105},{"name":"テンジクダイ科","book_page":100,"page":106},{"name":"アマダイ科","book_page":112,"page":118},{"name":"キツネアマダイ科","book_page":112,"page":118},{"name":"ムツ科","book_page":114,"page":120},{"name":"コバンザメ科","book_page":115,"page":121},{"name":"アジ科","book_page":115,"page":121},{"name":"シマガツオ科","book_page":121,"page":127},{"name":"フエダイ科","book_page":121,"page":127},{"name":"タカサゴ科","book_page":126,"page":132},{"name":"マツダイ科","book_page":127,"page":133},{"name":"クロサギ科","book_page":128,"page":134},{"name":"イサキ科","book_page":128,"page":134},{"name":"フエフキダイ科","book_page":135,"page":141},{"name":"キス科","book_page":137,"page":143},{"name":"ヒメジ科","book_page":137,"page":143},{"name":"ハタンポ科","book_page":141,"page":147},{"name":"チョウチョウウオ科","book_page":142,"page":148},{"name":"キンチャクダイ科","book_page":158,"page":164},{"name":"カワビシャ科","book_page":170,"page":176},{"name":"ゴンベ科","book_page":170,"page":176},{"name":"タカノハダイ科","book_page":174,"page":180},{"name":"アカタチ科","book_page":175,"page":181},{"name":"ウミタナゴ科","book_page":175,"page":181},{"name":"スズメダイ科","book_page":176,"page":182},{"name":"タカベ科","book_page":200,"page":206},{"name":"イシダイ科","book_page":201,"page":207},{"name":"イスズミ科","book_page":201,"page":207},{"name":"カゴカキダイ科","book_page":203,"page":209},{"name":"メジナ科","book_page":203,"page":209},{"name":"イボダイ科","book_page":204,"page":210},{"name":"エボシダイ科","book_page":205,"page":211},{"name":"ベラ科","book_page":205,"page":211},{"name":"ブダイ科","book_page":253,"page":259},{"name":"カジカ科","book_page":266,"page":272},{"name":"ダンゴウオ科","book_page":266,"page":272},{"name":"クサウオ科","book_page":267,"page":273},{"name":"トラギス科","book_page":267,"page":273},{"name":"ベラギンポ科","book_page":271,"page":277},{"name":"ミシマオコゼ科","book_page":272,"page":278},{"name":"ヘビギンポ科","book_page":272,"page":278},{"name":"コケギンポ科","book_page":281,"page":287},{"name":"イソギンポ科","book_page":285,"page":291},{"name":"ウバウオ科","book_page":294,"page":300},{"name":"ネズッポ科","book_page":296,"page":302},{"name":"ハゼ科","book_page":301,"page":307},{"name":"クロユリハゼ科","book_page":329,"page":335},{"name":"アイゴ科","book_page":333,"page":339},{"name":"ツノダシ科","book_page":334,"page":340},{"name":"ニザダイ科","book_page":334,"page":340},{"name":"カマス科","book_page":345,"page":351},{"name":"サバ科","book_page":347,"page":353},{"name":"ヒラメ科","book_page":349,"page":355},{"name":"ダルマガレイ科","book_page":349,"page":355},{"name":"べロガレイ科","book_page":349,"page":355},{"name":"ササウシノシタ科","book_page":350,"page":356},{"name":"ギマ科","book_page":351,"page":357},{"name":"モンガラカワハギ科","book_page":351,"page":357},{"name":"カワハギ科","book_page":357,"page":363},{"name":"ハコフグ科","book_page":363,"page":369},{"name":"フグ科","book_page":366,"page":372},{"name":"ハリセンボン科","book_page":372,"page":378},{"name":"マンボウ科","book_page":373,"page":379}];

    // ── DOM ──────────────────────────────────────────
    const input    = document.getElementById('search-input');
    const dropdown = document.getElementById('dropdown');
    const frame    = document.getElementById('pdf-frame');
    const toast    = document.getElementById('toast');

    let activeIdx = -1;
    let filtered  = [];
    let pdfReady  = false;
    let pendingPage = null;
    let pendingToastData = null;

    // ── 履歴 (localStorage) ──────────────────────────
    const HISTORY_KEY = 'guidebook_recent';
    const HISTORY_MAX = 5;

    function saveHistory(item) {
      let hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      hist = hist.filter(h => h.name !== item.name);
      hist.unshift({name: item.name, book_page: item.book_page, page: item.page});
      if (hist.length > HISTORY_MAX) hist = hist.slice(0, HISTORY_MAX);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    }

    function showHistory() {
      const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      if (!hist.length) return;
      dropdown.innerHTML =
        '<div class="dropdown-section-label">最近見た科</div>' +
        hist.map((item, i) => `
          <div class="dropdown-item" data-idx="${i}" role="option">
            <span class="item-name">${item.name}</span>
            <span class="item-page">p.${item.book_page}</span>
          </div>
        `).join('');
      filtered = hist;
      dropdown.classList.add('open');
      activeIdx = -1;
    }

    // ── PDF.js 準備完了検知 ───────────────────────────
    frame.addEventListener('load', () => {
      // PDF.js のロードを少し待ってからフラグを立てる
      const checkReady = setInterval(() => {
        try {
          const app = frame.contentWindow.PDFViewerApplication;
          if (app && app.pdfViewer && app.pdfDocument) {
            pdfReady = true;
            clearInterval(checkReady);
            if (pendingPage !== null) {
              jumpTo(pendingPage);
              if (pendingToastData) {
                showToast(pendingToastData.name, pendingToastData.book_page, pendingToastData.page);
                pendingToastData = null;
              }
              pendingPage = null;
            }
          }
        } catch (e) {
          // cross-origin 等のエラーは無視
        }
      }, 300);
    });

    // ── ページジャンプ ───────────────────────────────
    function jumpTo(pdfPage) {
      try {
        const app = frame.contentWindow.PDFViewerApplication;
        if (app && app.pdfViewer) {
          app.pdfViewer.currentPageNumber = pdfPage;
          pdfReady = true;
          return true;
        }
      } catch (e) {}

      // フォールバック: src を差し替え
      frame.src = `${VIEWER}?file=${encodeURIComponent(PDF_URL)}#page=${pdfPage}`;
      return false;
    }

    function showToast(name, bookPage, pdfPage) {
      toast.textContent = `${name}  →  書籍 p.${bookPage}（PDF p.${pdfPage}）`;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // ── 検索 ─────────────────────────────────────────
    function renderDropdown(items) {
      if (!items.length) {
        dropdown.classList.remove('open');
        return;
      }
      dropdown.innerHTML = items.map((item, i) => `
        <div class="dropdown-item" data-idx="${i}" role="option">
          <span class="item-name">${item.name}</span>
          <span class="item-page">p.${item.book_page}</span>
        </div>
      `).join('');
      dropdown.classList.add('open');
      activeIdx = -1;
    }

    function closeDropdown() {
      dropdown.classList.remove('open');
      activeIdx = -1;
    }

    function selectItem(item) {
      input.value = item.name;
      closeDropdown();
      saveHistory(item);
      if (pdfReady) {
        jumpTo(item.page);
      } else {
        pendingPage = item.page;
        frame.src = `${VIEWER}?file=${encodeURIComponent(PDF_URL)}#page=${item.page}`;
      }
      showToast(item.name, item.book_page, item.page);
    }

    input.addEventListener('input', () => {
      const q = input.value.trim();
      if (!q) { showHistory(); return; }
      filtered = TOC.filter(t => t.name.includes(q));
      renderDropdown(filtered);
    });

    input.addEventListener('focus', () => {
      if (!input.value.trim()) showHistory();
    });

    input.addEventListener('keydown', e => {
      if (!dropdown.classList.contains('open')) return;
      const items = dropdown.querySelectorAll('.dropdown-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
      } else if (e.key === 'Enter' && activeIdx >= 0) {
        e.preventDefault();
        selectItem(filtered[activeIdx]);
        return;
      } else if (e.key === 'Escape') {
        closeDropdown();
        return;
      }
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      if (activeIdx >= 0) items[activeIdx].scrollIntoView({ block: 'nearest' });
    });

    dropdown.addEventListener('mousedown', e => {
      const item = e.target.closest('.dropdown-item');
      if (!item) return;
      e.preventDefault();
      selectItem(filtered[+item.dataset.idx]);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) closeDropdown();
    });

    // ── 目次ボタン ────────────────────────────────────
    const TOC_PDF_PAGE = 8;
    document.getElementById('toc-btn').addEventListener('click', () => {
      if (pdfReady) {
        jumpTo(TOC_PDF_PAGE);
      } else {
        frame.src = `${VIEWER}?file=${encodeURIComponent(PDF_URL)}#page=${TOC_PDF_PAGE}`;
      }
      showToast('目次', TOC_PDF_PAGE - 6, TOC_PDF_PAGE);
    });

    // ── 全画面トグル ──────────────────────────────────
    function toggleFullscreen() {
      document.body.classList.toggle('fullscreen');
    }
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
    document.getElementById('exit-fs').addEventListener('click', toggleFullscreen);

    // ── URLパラメータ処理 (fish.html → guidebook リンク) ──
    (function() {
      const params = new URLSearchParams(location.search);
      const family = params.get('family');
      if (!family) return;
      const entry = TOC.find(t => t.name === family);
      if (!entry) return;
      input.value = entry.name;
      pendingPage = entry.page;
      pendingToastData = {name: entry.name, book_page: entry.book_page, page: entry.page};
      frame.src = `${VIEWER}?file=${encodeURIComponent(PDF_URL)}#page=${entry.page}`;
    })();
  </script>
</body>
</html>
