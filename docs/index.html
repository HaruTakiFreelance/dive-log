<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dive Log Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --phi: 1.618;

      --paper:     #f4ede0;
      --paper-d:   #e8dbc8;
      --ink:       #333333;
      --ink-fade:  #666655;
      --ink-faint: #999988;
      --accent:    #3d6b8a;
      --accent-d:  #2a4f6b;
      --rust:      #8b3a1e;
      --shadow:    rgba(51,51,51,0.15);

      --sp-xs:  0.382rem;
      --sp-s:   0.618rem;
      --sp-m:   1rem;
      --sp-l:   1.618rem;
      --sp-xl:  2.618rem;
      --sp-xxl: 4.236rem;

      --fs-xs:  0.618rem;
      --fs-s:   0.764rem;
      --fs-m:   1rem;
      --fs-l:   1.272rem;
      --fs-xl:  1.618rem;
      --fs-xxl: 2.618rem;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(180deg, #03111f 0%, #051828 45%, #071e32 100%);
      min-height: 100vh;
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--ink);
      padding: 2rem 1rem 4rem;
    }

    .sea {
      position: fixed; inset: 0;
      pointer-events: none; overflow: hidden; z-index: 0;
    }
    .book { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }

    @keyframes rise {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      8%   { opacity: 0.35; }
      88%  { opacity: 0.18; }
      100% { transform: translateY(-108vh) translateX(var(--drift)); opacity: 0; }
    }
    .b {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(140,220,255,0.18);
      background: radial-gradient(circle at 32% 28%, rgba(200,240,255,0.12), rgba(60,170,255,0.02));
      animation: rise var(--dur) ease-in var(--delay) infinite;
    }
    @keyframes swim-right {
      0%   { transform: translateX(-200px); opacity: 0; }
      6%   { opacity: 0.8; }
      92%  { opacity: 0.7; }
      100% { transform: translateX(calc(100vw + 200px)); opacity: 0; }
    }
    @keyframes swim-left {
      0%   { transform: translateX(calc(100vw + 200px)) scaleX(-1); opacity: 0; }
      6%   { opacity: 0.8; }
      92%  { opacity: 0.7; }
      100% { transform: translateX(-200px) scaleX(-1); opacity: 0; }
    }
    .fish-sea { position: absolute; pointer-events: none; }

    /* ── cover card ── */
    .cover-card {
      background: var(--paper);
      border-radius: 2px;
      box-shadow: 0 2px 6px var(--shadow), 0 8px 24px rgba(0,0,0,0.35);
      position: relative; overflow: hidden;
      margin-bottom: 2rem;
    }
    .cover-card::before {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(44,30,16,0.06) 28px);
      pointer-events: none;
    }
    .cover-inner { padding: 3rem 3.5rem; position: relative; }

    .stamp {
      display: inline-block;
      border: 3px double var(--rust);
      padding: 0.4rem 1.2rem;
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--rust);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
    .title {
      font-family: 'Special Elite', monospace;
      font-size: clamp(2.4rem, 6vw, 4rem);
      color: var(--ink);
      letter-spacing: 0.05em;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--ink-fade);
      margin-bottom: 2rem;
    }

    /* ── stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .stat-box {
      text-align: center;
      padding: 0.8rem 0.5rem;
      border: 1px solid var(--paper-d);
      background: rgba(255,255,255,0.3);
    }
    .stat-num {
      font-family: 'Special Elite', monospace;
      font-size: 2rem;
      color: var(--accent-d);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      margin-top: 0.3rem;
    }
    .time-note {
      text-align: center;
      font-family: 'Special Elite', monospace;
      font-size: 0.8rem;
      color: var(--ink-fade);
      letter-spacing: 0.15em;
      margin: 0.5rem 0 0;
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      color: var(--ink-faint);
      font-size: 0.8rem;
      letter-spacing: 0.5em;
    }
    .divider::before, .divider::after { content: '─────'; margin: 0 0.5em; }

    /* ── session grid ── */
    .section-title {
      font-family: 'Special Elite', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .session-card {
      background: var(--paper);
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 1px 3px var(--shadow);
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      display: block;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .session-card:hover {
      transform: translateY(-3px) rotate(0.3deg);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      filter: sepia(20%) saturate(85%);
      border-bottom: 2px solid var(--paper-d);
    }
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--paper-d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border-bottom: 2px solid var(--paper-d);
      opacity: 0.5;
    }

    .card-body { padding: 0.9rem 1rem; }

    .card-date {
      font-family: 'Special Elite', monospace;
      font-size: 0.68rem;
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.2rem;
    }
    .card-location {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }
    .card-meta {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .card-chip {
      font-family: 'Special Elite', monospace;
      font-size: 0.68rem;
      color: var(--ink-fade);
      background: var(--paper-d);
      padding: 3px 8px;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .card-chip.accent {
      background: var(--accent);
      color: #deeaf3;
    }

    .build-note {
      text-align: center;
      font-family: 'Special Elite', monospace;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.2);
      margin-top: 2rem;
      letter-spacing: 0.15em;
    }

    @media (max-width: 600px) {
      .cover-inner { padding: 2rem 1.5rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .sessions-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  var count=3+Math.floor(Math.random()*3);
  var pool=FISH.map(function(_,i){return i;});
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  pool.slice(0,count).forEach(function(fi,idx){
    var f=FISH[fi];
    var goRight=Math.random()>0.5;
    var bottom=(8+Math.random()*72).toFixed(1);
    var width=(40+Math.random()*90).toFixed(0);
    var dur=(15+Math.random()*32).toFixed(1);
    var delay=(5+idx*5+Math.random()*4).toFixed(1);
    var el=document.createElementNS('http://www.w3.org/2000/svg','svg');
    el.setAttribute('viewBox',f[0]);
    el.setAttribute('xmlns','http://www.w3.org/2000/svg');
    el.classList.add('fish-sea');
    el.style.cssText='bottom:'+bottom+'%;width:'+width+'px;opacity:0;animation:'+(goRight?'swim-right':'swim-left')+' '+dur+'s linear '+delay+'s infinite normal backwards';
    el.innerHTML=f[1];
    sea.appendChild(el);
  });
})();
</script>
