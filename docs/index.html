<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dive Log Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --phi: 1.618;

      --paper:     #f4ede0;
      --paper-d:   #e8dbc8;
      --ink:       #333333;
      --ink-fade:  #666655;
      --ink-faint: #999988;
      --accent:    #3d6b8a;
      --accent-d:  #2a4f6b;
      --rust:      #8b3a1e;
      --shadow:    rgba(51,51,51,0.15);

      --sp-xs:  0.382rem;
      --sp-s:   0.618rem;
      --sp-m:   1rem;
      --sp-l:   1.618rem;
      --sp-xl:  2.618rem;
      --sp-xxl: 4.236rem;

      --fs-xs:  0.618rem;
      --fs-s:   0.764rem;
      --fs-m:   1rem;
      --fs-l:   1.272rem;
      --fs-xl:  1.618rem;
      --fs-xxl: 2.618rem;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #2a2016;
      background-image:
        radial-gradient(ellipse at 30% 10%, #3d2e1a 0%, transparent 60%),
        radial-gradient(ellipse at 70% 90%, #1e1608 0%, transparent 60%);
      min-height: 100vh;
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--ink);
      padding: 2rem 1rem 4rem;
    }

    .book { max-width: 860px; margin: 0 auto; }

    /* ── cover card ── */
    .cover-card {
      background: var(--paper);
      border-radius: 2px;
      box-shadow: 0 2px 6px var(--shadow), 0 8px 24px rgba(0,0,0,0.35);
      position: relative; overflow: hidden;
      margin-bottom: 2rem;
    }
    .cover-card::before {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(44,30,16,0.06) 28px);
      pointer-events: none;
    }
    .cover-inner { padding: 3rem 3.5rem; position: relative; }

    .stamp {
      display: inline-block;
      border: 3px double var(--rust);
      padding: 0.4rem 1.2rem;
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--rust);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
    .title {
      font-family: 'Special Elite', monospace;
      font-size: clamp(2.4rem, 6vw, 4rem);
      color: var(--ink);
      letter-spacing: 0.05em;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--ink-fade);
      margin-bottom: 2rem;
    }

    /* ── stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .stat-box {
      text-align: center;
      padding: 0.8rem 0.5rem;
      border: 1px solid var(--paper-d);
      background: rgba(255,255,255,0.3);
    }
    .stat-num {
      font-family: 'Special Elite', monospace;
      font-size: 2rem;
      color: var(--accent-d);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      margin-top: 0.3rem;
    }
    .time-note {
      text-align: center;
      font-family: 'Special Elite', monospace;
      font-size: 0.8rem;
      color: var(--ink-fade);
      letter-spacing: 0.15em;
      margin: 0.5rem 0 0;
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      color: var(--ink-faint);
      font-size: 0.8rem;
      letter-spacing: 0.5em;
    }
    .divider::before, .divider::after { content: '─────'; margin: 0 0.5em; }

    /* ── session grid ── */
    .section-title {
      font-family: 'Special Elite', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .session-card {
      background: var(--paper);
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 1px 3px var(--shadow);
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      display: block;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .session-card:hover {
      transform: translateY(-3px) rotate(0.3deg);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      filter: sepia(20%) saturate(85%);
      border-bottom: 2px solid var(--paper-d);
    }
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--paper-d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border-bottom: 2px solid var(--paper-d);
      opacity: 0.5;
    }

    .card-body { padding: 0.9rem 1rem; }

    .card-date {
      font-family: 'Special Elite', monospace;
      font-size: 0.68rem;
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.2rem;
    }
    .card-location {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }
    .card-meta {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .card-chip {
      font-family: 'Special Elite', monospace;
      font-size: 0.68rem;
      color: var(--ink-fade);
      background: var(--paper-d);
      padding: 1px 7px;
      letter-spacing: 0.04em;
    }
    .card-chip.accent {
      background: var(--accent);
      color: #deeaf3;
    }

    .build-note {
      text-align: center;
      font-family: 'Special Elite', monospace;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.2);
      margin-top: 2rem;
      letter-spacing: 0.15em;
    }

    @media (max-width: 600px) {
      .cover-inner { padding: 2rem 1.5rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .sessions-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="book">

  <!-- カバー -->
  <div class="cover-card">
    <div class="cover-inner">
      <div class="stamp">Personal Dive Log Book</div>
      <div class="title">Dive Log</div>
      <div class="subtitle">水中の記録</div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num">128</div>
          <div class="stat-label">TOTAL DIVES</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">20</div>
          <div class="stat-label">SPECIES</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">1</div>
          <div class="stat-label">LOCATIONS</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">30.8m</div>
          <div class="stat-label">MAX DEPTH</div>
        </div>
      </div>
      
      <div class="time-note">TOTAL UNDERWATER — 1h 49m</div>
      

      <div class="divider">✦</div>
      <div style="font-family:'Caveat',cursive; font-size:1rem; color:var(--ink-fade); text-align:center;">
        2026-06-21 〜 2026-06-21
      </div>
    </div>
  </div>

  <!-- ナビゲーション -->
  <style>
    .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1.6rem; }
    .nav-card {
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-end;
      padding: 0.9rem 1rem;
      background: var(--paper);
      border-radius: 2px;
      border-left: 3px solid var(--paper-d);
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      min-height: 72px;
    }
    .nav-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    .nav-card-en {
      font-family: 'Special Elite', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .nav-card-ja {
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: var(--ink);
      line-height: 1.2;
    }
  </style>
  <div class="nav-grid">
    <a href="record/index.html" class="nav-card">
      <div class="nav-card-en">Record</div>
      <div class="nav-card-ja">ダイブ記録</div>
    </a>
    <a href="fish.html" class="nav-card">
      <div class="nav-card-en">Encyclopedia</div>
      <div class="nav-card-ja">魚図鑑</div>
    </a>
    <a href="workflow/index.html" class="nav-card">
      <div class="nav-card-en">How to use</div>
      <div class="nav-card-ja">使い方</div>
    </a>
  </div>

  <!-- セッション一覧 -->
  <div class="section-title">── All Sessions ──</div>
  <div class="sessions-grid">
    
    <a class="session-card" href="sessions/2026-06-21_大瀬崎.html">
      
      <img class="card-thumb" src="photos/2026-06-25_547a825b.jpg" alt="大瀬崎"
           loading="lazy"
           onerror="this.outerHTML='<div class=\'card-thumb-placeholder\'>🤿</div>'">
      
      <div class="card-body">
        <div class="card-date">6月21日 · 2026</div>
        <div class="card-location">大瀬崎</div>
        <div class="card-meta">
          <span class="card-chip accent">3 dives</span>
          <span class="card-chip">#126〜128本目</span>
          
          <span class="card-chip">🐠 20種</span>
          
        </div>
      </div>
    </a>
    
  </div>

</div>
<div class="build-note">Generated 2026年6月25日 · Dive Log Book</div>
</body>
</html>
